name: Build & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z tag to publish (blank = tests only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mauleaf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - run: bash tests/run.sh
  build:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || exit 1
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          ((minor < 1000 && patch < 1000)) || exit 1
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major*1000000+minor*1000+patch))" >> "$GITHUB_ENV"
      - name: Package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash Scripts/ci/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MauLeaf-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release notes and assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          V="${RELEASE_TAG#v}"; F="docs/releases/v$V.md"
          test -s "$F"
          grep -q '## 简体中文' "$F"
          grep -q '## English' "$F"
          grep -qi Intel "$F"
          grep -q '实验' "$F"
          test -s "artifacts/MauLeaf-$V-macos-arm64.dmg"
          test -s "artifacts/MauLeaf-$V-macos-x86_64-EXPERIMENTAL.dmg"
      - name: Fetch GPL corresponding source
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < Vendor/batt-version)" == "v0.8.0" ]] || exit 1
          curl -fLsS --retry 3 "https://github.com/charlie0129/batt/archive/refs/tags/v0.8.0.tar.gz" -o artifacts/batt-v0.8.0-source.tar.gz
          # Fully consume the archive listing first. grep -q in a pipe can
          # cause tar: stdout: write error when pipefail is enabled.
          tar -tzf artifacts/batt-v0.8.0-source.tar.gz > "$RUNNER_TEMP/batt-source-contents.txt"
          grep -Eq '(^|/)LICENSE$' "$RUNNER_TEMP/batt-source-contents.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          (cd artifacts && sha256sum *.dmg batt-v0.8.0-source.tar.gz > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS.txt \
            artifacts/batt-v0.8.0-source.tar.gz --verify-tag \
            --title "MauLeaf $RELEASE_TAG" --notes-file "docs/releases/v$V.md"
