name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish an existing vX.Y.Z or vX.Y.Z-preview.N tag'
        required: false
        type: string
      preview_tag:
        description: 'Create a new preview tag from main (normally automatic after merge)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mauleaf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Run tests
        run: bash tests/run.sh


  # Exercise the exact Apple Silicon packaging path before merging.
  # This produces a local smoke-test DMG but does not upload or publish it.
  package-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify arm64 DMG
        env:
          TARGET_ARCH: arm64
          BUILD_NUMBER: '8000'
          FIX2_CANDIDATE: ${{ github.event.pull_request.number == 58 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/firmware-zero-readiness' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          export RELEASE_VERSION
          # A PR candidate uses the next preview sequence, but does not
          # create a tag or Release. This avoids preview.0 appearing older
          # than the already installed preview when testing UI changes.
          git fetch --tags --quiet origin
          latest="$(git tag --list "v${RELEASE_VERSION}-preview.*" \
            | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+-preview\.([0-9]+)$/\1/p' \
            | sort -n | tail -n 1)"
          next_preview=$((${latest:-0} + 1))
          if [[ "$FIX2_CANDIDATE" == "true" ]]; then
            [[ "$RELEASE_VERSION" == "1.0.0" ]] || exit 2
            export RELEASE_LABEL="1.0.0-fix2"
          else
            export RELEASE_LABEL="${RELEASE_VERSION}-preview.${next_preview}"
          fi
          echo "PR-only candidate: ${RELEASE_LABEL} (no release tag)"
          bash Scripts/ci/package-macos.sh
          test -s "dist/MauLeaf-${RELEASE_LABEL}-macos-arm64.dmg"
      # Preserve a PR-only candidate so the UI can be reviewed on a real Mac
      # before merging and publishing any release tag. Not a stable build.
      - name: Upload arm64 preview candidate for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: mauleaf-arm64-pr-${{ github.event.pull_request.number }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # One explicitly requested test release from the trusted same-repo fix2 PR.
  # The exact tested merge commit is tagged; main and stable releases remain unchanged.
  publish-fix2:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 58 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/firmware-zero-readiness'
    needs: [test, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mauleaf-arm64-pr-58
          path: artifacts
      - name: Publish verified fix2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.0.0-fix2
          dmg=artifacts/MauLeaf-1.0.0-fix2-macos-arm64.dmg
          test -s "$dmg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The immutable fix2 release already exists; refusing to overwrite."
            exit 0
          fi
          (cd artifacts && sha256sum MauLeaf-1.0.0-fix2-macos-arm64.dmg > SHA256SUMS.txt)
          cat > notes.md <<'EOF'
          ## 简体中文
          - 增加强制重置、孤立充满任务清理及可信原始配置恢复。
          - 修复 Helper 版本不匹配与固件未就绪提示，简化菜单栏反馈。
          - Apple Silicon (arm64)，macOS 15；测试候选版，仍需真机验证。

          ## English
          - Add force reset, orphaned full-charge task cleanup and verified reconnect recovery.
          - Simplify firmware readiness feedback and safely reinstall incompatible Helpers.
          - Apple Silicon (arm64), macOS 15; test prerelease, physical-device validation pending.
          EOF
          gh release create "$tag" "$dmg" artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" \
            --title "MauLeaf 1.0.0-fix2" --notes-file notes.md --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets

  prepare:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.preview_tag != ''))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      label: ${{ steps.prepare.outputs.label }}
      build_number: ${{ steps.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Select and prepare release tag
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
          EXISTING_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          CREATE_TAG=false
          RELEASE_TAG=""

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF_VALUE" == "refs/heads/main" ]]; then
            BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
            [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "VERSION must contain a semantic version such as 0.8.0" >&2
              exit 1
            }
            # A version with committed, bilingual stable notes is released
            # once. Do not generate further previews for a released version.
            if git ls-remote --exit-code --tags origin "refs/tags/v${BASE_VERSION}" >/dev/null 2>&1; then
              echo "Stable v${BASE_VERSION} already exists. No automatic preview will be published."
              exit 0
            fi
            if [[ -s "docs/releases/v${BASE_VERSION}.md" ]]; then
              RELEASE_TAG="v${BASE_VERSION}"
              CREATE_TAG=true
            else
              latest="$(git tag --list "v${BASE_VERSION}-preview.*" \
                | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+-preview\.([0-9]+)$/\1/p' \
                | sort -n | tail -n 1)"
              # Resume a preview whose tag and DMG build succeeded but whose
              # Release publishing step failed (e.g., a notes validation issue).
              # Never replace a published tag or increment the preview number
              # solely because the previous Release is missing.
              if [[ -n "$latest" ]] && ! gh release view "v${BASE_VERSION}-preview.${latest}" >/dev/null 2>&1; then
                RELEASE_TAG="v${BASE_VERSION}-preview.${latest}"
                CREATE_TAG=false
                echo "Resuming missing Release for existing tag: $RELEASE_TAG"
              else
                next=$(("${latest:-0}" + 1))
                RELEASE_TAG="v${BASE_VERSION}-preview.${next}"
                CREATE_TAG=true
              fi
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$PREVIEW_TAG" ]]; then
            [[ "$GITHUB_REF_VALUE" == "refs/heads/main" ]] || {
              echo "Create preview tags from main only." >&2
              exit 1
            }
            [[ "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || exit 1
            RELEASE_TAG="$PREVIEW_TAG"
            CREATE_TAG=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$EXISTING_RELEASE_TAG" ]]; then
            RELEASE_TAG="$EXISTING_RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF_VALUE" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME_VALUE"
          else
            echo "No release requested; tests completed only."
            exit 0
          fi

          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-preview\.([0-9]+))?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          ((minor < 1000 && patch < 1000)) || exit 1

          if [[ "$CREATE_TAG" == "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG already exists; refusing to overwrite." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "MauLeaf $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          else
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "label=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
          echo "Prepared release: $RELEASE_TAG"

  build:
    if: needs.prepare.result == 'success' && needs.prepare.outputs.tag != ''
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_LABEL: ${{ needs.prepare.outputs.label }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: bash Scripts/ci/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MauLeaf-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: needs.prepare.result == 'success' && needs.prepare.outputs.tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release notes and assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_LABEL: ${{ needs.prepare.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "docs/releases/v${RELEASE_LABEL}.md" ]]; then
            cp "docs/releases/v${RELEASE_LABEL}.md" artifacts/RELEASE_NOTES.md
          elif [[ "$RELEASE_TAG" == *-preview.* && -s docs/releases/PREVIEW_TEMPLATE.md ]]; then
            sed "s/{{VERSION}}/${RELEASE_LABEL}/g" docs/releases/PREVIEW_TEMPLATE.md > artifacts/RELEASE_NOTES.md
          else
            echo "Missing release notes for $RELEASE_TAG and no preview template is available." >&2
            exit 1
          fi
          grep -q '## 简体中文' artifacts/RELEASE_NOTES.md
          grep -q '## English' artifacts/RELEASE_NOTES.md
          # Platform metadata is a release property, not a localization test.
          # Supply an explicit platform note if a dedicated bilingual note
          # uses only "arm64" without spelling out "Apple Silicon".
          if ! grep -qi 'Apple Silicon' artifacts/RELEASE_NOTES.md; then
            printf '\n\nTarget platform: Apple Silicon (arm64) only.\n' >> artifacts/RELEASE_NOTES.md
          fi
          grep -qi 'Apple Silicon' artifacts/RELEASE_NOTES.md
          test -s "artifacts/MauLeaf-${RELEASE_LABEL}-macos-arm64.dmg"
          if find artifacts -maxdepth 1 -type f | grep -Eq 'x86_64|INTEL'; then
            echo "Intel artifacts are not part of Preview 5." >&2
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_LABEL: ${{ needs.prepare.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          (cd artifacts && sha256sum *.dmg > SHA256SUMS.txt)
          PRE_FLAG=()
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then PRE_FLAG+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS.txt \
            --verify-tag --title "MauLeaf $RELEASE_TAG" \
            --notes-file artifacts/RELEASE_NOTES.md "${PRE_FLAG[@]}"

  # Do not prune anything until the stable Release and both assets exist.
  cleanup:
    if: >-
      needs.release.result == 'success' &&
      needs.prepare.outputs.tag != '' &&
      !contains(needs.prepare.outputs.tag, '-preview.')
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Verify official release, remove superseded previews and merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash Scripts/ci/cleanup-after-stable.sh "$STABLE_TAG"
