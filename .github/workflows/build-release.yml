name: Build & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z or vX.Y.Z-preview.N tag to republish'
        required: false
        type: string
      preview_tag:
        description: 'Create and publish a new vX.Y.Z-preview.N tag from main'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mauleaf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - run: bash tests/run.sh
  build:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.preview_tag != ''))
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.preview_tag || inputs.release_tag || github.ref_name }}
          CREATE_PREVIEW_TAG: ${{ inputs.preview_tag != '' }}
          EXISTING_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CREATE_PREVIEW_TAG" == "true" && -n "$EXISTING_RELEASE_TAG" ]]; then
            echo "Choose either preview_tag or release_tag, not both." >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-preview\.([0-9]+))?$ ]] || exit 1
          if [[ "$CREATE_PREVIEW_TAG" == "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG already exists; refusing to overwrite" >&2
              exit 1
            fi
          else
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          ((minor < 1000 && patch < 1000)) || exit 1
          echo "RELEASE_VERSION=${major}.${minor}.${patch}" >> "$GITHUB_ENV"
          echo "RELEASE_LABEL=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major*1000000+minor*1000+patch))" >> "$GITHUB_ENV"
      - name: Package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_LABEL: ${{ inputs.preview_tag || inputs.release_tag || github.ref_name }}
        run: bash Scripts/ci/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MauLeaf-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.preview_tag != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create preview tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.preview_tag || inputs.release_tag || github.ref_name }}
          CREATE_PREVIEW_TAG: ${{ inputs.preview_tag != '' }}
        run: |
          set -euo pipefail
          if [[ "$CREATE_PREVIEW_TAG" == "true" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || exit 1
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG already exists; refusing to overwrite" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "MauLeaf $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
      - name: Verify release notes and assets
        env:
          RELEASE_TAG: ${{ inputs.preview_tag || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]] || exit 1
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          V="${RELEASE_TAG#v}"; F="docs/releases/v$V.md"
          test -s "$F"
          grep -q '## 简体中文' "$F"
          grep -q '## English' "$F"
          grep -qi Intel "$F"
          grep -q '实验' "$F"
          test -s "artifacts/MauLeaf-$V-macos-arm64.dmg"
          test -s "artifacts/MauLeaf-$V-macos-x86_64-EXPERIMENTAL.dmg"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.preview_tag || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          (cd artifacts && sha256sum *.dmg > SHA256SUMS.txt)
          PRE_FLAG=()
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then PRE_FLAG+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS.txt --verify-tag \
            --title "MauLeaf $RELEASE_TAG" --notes-file "docs/releases/v$V.md" "${PRE_FLAG[@]}"
