name: Build & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mauleaf-$\{{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    runs-on: $\{{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || exit 1
          major="$\{BASH_REMATCH[1]}"; minor="$\{BASH_REMATCH[2]}"; patch="$\{BASH_REMATCH[3]}"
          ((minor < 1000 && patch < 1000)) || exit 1
          echo "RELEASE_VERSION=$\{GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major*1000000+minor*1000+patch))" >> "$GITHUB_ENV"
      - name: Package
        env:
          TARGET_ARCH: $\{{ matrix.arch }}
        run: bash Scripts/ci/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MauLeaf-$\{{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release notes and assets
        run: |
          set -euo pipefail
          V="$\{GITHUB_REF_NAME#v}"; F="docs/releases/v$V.md"
          test -s "$F"
          grep -q '## 简体中文' "$F"
          grep -q '## English' "$F"
          grep -qi Intel "$F"
          grep -q '实验' "$F"
          test -s "artifacts/MauLeaf-$V-macos-arm64.dmg"
          test -s "artifacts/MauLeaf-$V-macos-x86_64-EXPERIMENTAL.dmg"
      - name: Fetch GPL corresponding source
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < Vendor/batt-version)" == "v0.8.0" ]] || exit 1
          curl -fLsS --retry 3 "https://github.com/charlie0129/batt/archive/refs/tags/v0.8.0.tar.gz" -o artifacts/batt-v0.8.0-source.tar.gz
          tar -tzf artifacts/batt-v0.8.0-source.tar.gz | grep -q 'LICENSE$'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: $\{{ github.token }}
        run: |
          set -euo pipefail
          V="$\{GITHUB_REF_NAME#v}"
          (cd artifacts && sha256sum *.dmg batt-v0.8.0-source.tar.gz > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg artifacts/SHA256SUMS.txt \
            artifacts/batt-v0.8.0-source.tar.gz --verify-tag \
            --title "MauLeaf $GITHUB_REF_NAME" --notes-file "docs/releases/v$V.md"
