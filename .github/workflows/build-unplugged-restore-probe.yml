name: Build MauLeaf Unplugged Restore Probe

on:
  push:
    paths:
      - "Tools/MauLeafUnpluggedRestoreProbe/**"
      - "Sources/FirmwareLimitCore.swift"
      - "Sources/FirmwareLimitReconciliation.swift"
      - "Sources/FirmwareLimitSMCTransport.swift"
      - "Sources/SystemFirmwareReader.swift"
      - "Sources/FirmwareLimitRuntime.swift"
      - "Sources/BatteryStatusReader.swift"
      - ".github/workflows/build-unplugged-restore-probe.yml"
  pull_request:
    paths:
      - "Tools/MauLeafUnpluggedRestoreProbe/**"
      - "Sources/FirmwareLimitCore.swift"
      - "Sources/FirmwareLimitReconciliation.swift"
      - "Sources/FirmwareLimitSMCTransport.swift"
      - "Sources/SystemFirmwareReader.swift"
      - "Sources/FirmwareLimitRuntime.swift"
      - "Sources/BatteryStatusReader.swift"
      - ".github/workflows/build-unplugged-restore-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Validate fake transport and build macOS 15 arm64
    # Build the arm64 binary with the macOS 15 SDK; the host runner can be Intel.
    # This keeps the isolated diagnostics build independent of ARM runner scarcity.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm macOS 15 toolchain
        run: |
          set -euo pipefail
          sw_vers
          swift --version

      - name: Compile and run offline policy tests (FAKE SMC ONLY)
        run: |
          set -euo pipefail
          mkdir -p dist
          swiftc -parse-as-library \
            Sources/FirmwareLimitCore.swift \
            Tools/MauLeafUnpluggedRestoreProbe/UnpluggedRestorePolicy.swift \
            Tools/MauLeafUnpluggedRestoreProbe/Tests/UnpluggedRestorePolicyTests.swift \
            -o /tmp/MauLeafUnpluggedRestorePolicyTests
          /tmp/MauLeafUnpluggedRestorePolicyTests

      - name: Build standalone arm64 diagnostic (NEVER EXECUTE HARDWARE WRITE)
        run: |
          set -euo pipefail
          swiftc -O -parse-as-library \
            -target arm64-apple-macos15.0 \
            -framework IOKit \
            Sources/FirmwareLimitCore.swift \
            Sources/FirmwareLimitReconciliation.swift \
            Sources/FirmwareLimitSMCTransport.swift \
            Sources/SystemFirmwareReader.swift \
            Sources/FirmwareLimitRuntime.swift \
            Sources/BatteryStatusReader.swift \
            Tools/MauLeafUnpluggedRestoreProbe/UnpluggedRestorePolicy.swift \
            Tools/MauLeafUnpluggedRestoreProbe/MauLeafUnpluggedRestoreProbe.swift \
            -o dist/MauLeafUnpluggedRestoreProbe
          chmod +x dist/MauLeafUnpluggedRestoreProbe
          file dist/MauLeafUnpluggedRestoreProbe
          lipo -info dist/MauLeafUnpluggedRestoreProbe
          codesign --force --sign - dist/MauLeafUnpluggedRestoreProbe
          codesign --verify --strict dist/MauLeafUnpluggedRestoreProbe

      - name: Verify static safety boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("Tools/MauLeafUnpluggedRestoreProbe/UnpluggedRestorePolicy.swift").read_text()
          cli = Path("Tools/MauLeafUnpluggedRestoreProbe/MauLeafUnpluggedRestoreProbe.swift").read_text()
          assert 'transport.write(.activation, bytes: [0x00])' in source
          assert source.count('transport.write(') == 2
          assert 'FirmwareLimitWritePermit.targetBlockReason' in source
          assert 'originalSnapshot' in source
          assert 'pmsetOnBattery()' in cli
          assert 'MauLeafBatteryStatusReader.read()' in cli
          assert 'readOriginalSnapshot()' in cli
          assert 'isatty(STDIN_FILENO) == 1' in cli
          assert 'case "test-unplugged-deactivation":' in cli
          assert 'case "test-unplugged-full-restore":' in cli
          assert 'preflight(expected)' in source
          assert 'let upperFirst = original.upper > before.lower' in source
          assert 'try? transport.write' not in source
          PY

      - name: Bundle audit material and checksum
        run: |
          set -euo pipefail
          cp Tools/MauLeafUnpluggedRestoreProbe/README.md dist/
          cp Tools/MauLeafUnpluggedRestoreProbe/UnpluggedRestorePolicy.swift dist/
          cp Tools/MauLeafUnpluggedRestoreProbe/MauLeafUnpluggedRestoreProbe.swift dist/
          cp Sources/FirmwareLimitCore.swift dist/
          cp Sources/FirmwareLimitSMCTransport.swift dist/
          cp Sources/FirmwareLimitRuntime.swift dist/
          cp Sources/SystemFirmwareReader.swift dist/
          cp Sources/BatteryStatusReader.swift dist/
          cp Sources/FirmwareLimitReconciliation.swift dist/
          (cd dist && shasum -a 256 MauLeafUnpluggedRestoreProbe > SHA256SUMS.txt)

      - name: Publish temporary diagnostic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MauLeafUnpluggedRestoreProbe-macos15-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30
